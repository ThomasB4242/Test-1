# Survey Report Annotations
# -------------------------
# This file controls every slide in the generated PowerPoint.
# Edit headings, question text, bullet annotations, and base notes here,
# then re-run:
#   python main.py sample_data/sample_survey.sav --annotations sample_data/annotations_template.yaml
#
# Slide types:
#   cover       — full dark-teal title slide
#   section     — dark-teal divider between topics
#   commentary  — white slide with heading + bullets (no chart)
#   chart       — data slide: single question, individual horizontal bars
#   grid        — data slide: multiple related questions, stacked horizontal bars

report:
  title: "Community Attitudes Survey"
  date: "March 2026"
  base: "All respondents (n=200)"

slides:

  # ── Cover ─────────────────────────────────────────────────────────────────
  - type: cover
    title: "Community Attitudes Survey"
    subtitle: "March 2026"
    base: "n=200 adult residents"

  # ── Section divider ───────────────────────────────────────────────────────
  - type: section
    title: "Concern & Salience"

  # ── Commentary ────────────────────────────────────────────────────────────
  - type: commentary
    heading: "Key findings — concern & community attitudes"
    bold_intro: >
      Strong concern about the issue is evident across the community, with
      scepticism about how government is currently handling it.
    bullets:
      - "Over 60% are very or extremely concerned — concern is highest among 35–54 year olds."
      - "Agreement that this issue impacts everyday people is broad, cutting across regions."
      - "Government handling is rated poorly — fewer than 1 in 5 agree government is handling it well."
      - "There is strong appetite for local action alongside calls for stronger government leadership."
    base: "Base: all respondents (n=200)"

  # ── Chart: Issue concern ──────────────────────────────────────────────────
  - type: chart
    variable: issue_concern
    heading: "Concern about the issue"
    question: "How concerned are you about this issue in your community? (%)"
    chart_type: bar
    top_box:
      label: "Concerned"
      values:
        - "Very concerned"
        - "Extremely concerned"
    bottom_box:
      label: "Not concerned"
      values:
        - "Not very concerned"
        - "Not at all concerned"
    annotations:
      - "Concern by age group:"
      - "– 18–24:   XX% very/extremely concerned"
      - "– 25–34:   XX%"
      - "– 35–44:   XX%"
      - "– 45–54:   XX%"
      - "– 55+:     XX%"
      - ""
      - "Concern by region:"
      - "– Metro:      XX%"
      - "– Regional:   XX%"
      - "– Rural:      XX%"
    base: "Base: all respondents (n=200)"

  # ── Chart: Government handling ────────────────────────────────────────────
  - type: chart
    variable: govt_handling
    heading: "Rating — government handling of this issue"
    question: "The government is handling this issue effectively. (%)"
    chart_type: bar
    top_box:
      label: "Agree"
      values:
        - "Agree"
        - "Strongly agree"
    bottom_box:
      label: "Disagree"
      values:
        - "Disagree"
        - "Strongly disagree"
    annotations:
      - "Scepticism about government performance"
      - "is consistent across all demographics."
      - ""
      - "Disagreement is highest among:"
      - "– 35–54 year olds (XX%)"
      - "– Regional residents (XX%)"
    base: "Base: all respondents (n=200)"

  # ── Section divider ───────────────────────────────────────────────────────
  - type: section
    title: "Attitudes & Beliefs"

  # ── Grid: Agreement statements ────────────────────────────────────────────
  # Grid slides combine multiple related questions into one stacked bar chart.
  # scale_order: list response options from most-positive (top) to most-negative.
  - type: grid
    variables:
      - stmt_community
      - stmt_govt_role
      - stmt_local_action
    heading: "Agreement — statements about the issue"
    question: "How strongly do you agree or disagree with each of the following statements? (%)"
    scale_order:
      - "Strongly agree"
      - "Agree"
      - "Neither agree nor disagree"
      - "Disagree"
      - "Strongly disagree"
    top_box:
      label: "Total agree"
      values:
        - "Strongly agree"
        - "Agree"
    bottom_box:
      label: "Total disagree"
      values:
        - "Disagree"
        - "Strongly disagree"
    row_labels:
      - "This issue has a direct impact on everyday people in our community"
      - "Government must take a stronger leadership role on this issue"
      - "Local action can make a meaningful difference on this issue"
    annotations:
      - "Total agree by statement:"
      - "– Community impact:   XX%"
      - "– Govt leadership:    XX%"
      - "– Local action:       XX%"
      - ""
      - "Agreement is broadly consistent"
      - "across age groups and regions."
    base: "Base: all respondents (n=200)"

  # ── Chart: Support for action (pie chart) ────────────────────────────────
  - type: chart
    variable: support_action
    heading: "Support for action"
    question: "Do you support taking action on this issue? (%)"
    chart_type: pie
    top_box:
      label: "Support"
      values:
        - "Yes"
    bottom_box:
      label: "Oppose"
      values:
        - "No"
    annotations:
      - "Strong majority support for action."
      - ""
      - "Support is highest among:"
      - "– 35–54 year olds (XX%)"
      - "– Metro residents (XX%)"
    base: "Base: all respondents (n=200)"

  # ── Section divider ───────────────────────────────────────────────────────
  - type: section
    title: "Demographics"

  # ── Chart: Region ─────────────────────────────────────────────────────────
  - type: chart
    variable: region
    heading: "Respondent region"
    question: "Which region are you based in? (%)"
    chart_type: bar
    annotations:
      - "Sample is spread across metro, regional,"
      - "rural and remote areas."
    base: "Base: all respondents (n=200)"

  # ── Chart: Age group ──────────────────────────────────────────────────────
  - type: chart
    variable: age_group
    heading: "Respondent age group"
    question: "What is your age group? (%)"
    chart_type: bar
    annotations:
      - "Sample skews slightly toward working-age"
      - "adults (35–54)."
    base: "Base: all respondents (n=200)"
